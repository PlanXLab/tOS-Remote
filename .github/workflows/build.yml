name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # 저장소 Settings > Secrets and variables > Actions에 VSCE_PAT(Marketplace: Manage 권한 토큰)를 등록하면
      # v* 태그를 push할 때 Marketplace에 자동 게시한다. 등록하지 않으면 게시 단계는 건너뛴다.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: node test/run.js

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match package.json version $version"
          }

      - name: Package
        run: npx --yes @vscode/vsce package --out dist/

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.vsix

      - name: Publish to Visual Studio Marketplace
        if: startsWith(github.ref, 'refs/tags/v') && env.VSCE_PAT != ''
        shell: pwsh
        run: |
          $vsix = (Get-ChildItem dist/*.vsix | Select-Object -First 1).FullName
          npx --yes @vscode/vsce publish --packagePath "$vsix" --pat "$env:VSCE_PAT"
